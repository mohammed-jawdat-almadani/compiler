{% extends "base.html" %}
{% block title %}Products{% endblock %}

{% block content %}
<div class="h1">Products</div>
<div class="muted">Browse all products currently stored in memory.</div>

<div class="grid">
  {% for product in products %}
  <div class="card">
    <div class="img">
      <img src="{{ url_for('static', filename='images/' ~ product.image) }}" alt="{{ product.name }}">
    </div>

    <div class="body">
      <div class="name">{{ product.name }}</div>
      <div class="price">
        <span class="badge">Price</span>
        <span>{{ product.price }}$</span>
      </div>

      <div class="muted">{{ product.details }}</div>

      <div class="actions">
        <a class="btn primary" href="{{ url_for('product_details', product_id=product.id) }}">Details</a>
        <a class="btn danger"
           href="{{ url_for('delete_product', product_id=product.id) }}"
           onclick="return confirm('Are you sure you want to delete this product?')">
          Delete
        </a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
